[project]
name = "yacoru"
version = "0.1.3"
description = "Yet Another Command Runner"
readme = "README.md"
authors = [
    { name = "Sergio Delgado Quintero", email = "sdelquin@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.urls]
Repository = "https://github.com/sdelquin/yacoru"
Documentation = "https://yacoru.matraka.es"
Issues = "https://github.com/sdelquin/yacoru/issues"
Changelog = "https://github.com/sdelquin/yacoru/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.18.1",
]
docs = [
    "pdoc>=16.0.0",
]
